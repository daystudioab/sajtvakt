<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1117">
<title>{% block title %}Sajtvakt{% endblock %}</title>
<link rel="preload" href="/static/fonts/sora-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css?v={{ VERSION }}">
<script>
// Mjuk entré när du öppnar en sida – men inte när sidan laddar om sig själv (jobb som pågår).
(function () {
  var auto = false;
  try { auto = sessionStorage.getItem('sv-auto') === '1'; sessionStorage.removeItem('sv-auto'); } catch (e) {}
  if (!auto && location.pathname !== '/logga-in') document.documentElement.classList.add('intro');
})();
function svReload() { try { sessionStorage.setItem('sv-auto', '1'); } catch (e) {} location.reload(); }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='1' y='1' width='26' height='26' rx='7' fill='%233a4160'/%3E%3Cpath d='M6 15h4l2-5 4 9 2-4h4' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
{% block body %}
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/">{{ LOGO }}<span>Sajtvakt</span></a>
    <span class="spacer"></span>
    {% if not side.mail_ok %}<div class="chips"><span class="chip warn">E-post av</span></div>{% endif %}
    <div class="store {{ 'warn' if side.disk_warn }}" title="Backuper {{ side.stored | bytes }} · övrigt på servern {{ side.other_pct }} % · totalt {{ side.disk_total | bytes }} ({{ side.disk_pct }} % använt)">
      <span class="st-l">Lagrat <b>{{ side.stored | bytes }}</b> av {{ side.disk_total | bytes }}</span>
      <span class="st-bar" role="img" aria-label="{{ side.disk_pct }} procent av serverns disk används"><i class="st-bk" style="width: {{ side.stored_pct }}%"></i><i class="st-ot" style="width: {{ side.other_pct }}%"></i></span>
    </div>
    <form method="post" action="/logga-ut" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="btn ghost small" title="Logga ut">{{ icon("logout") }}<span class="sr">Logga ut</span></button></form>
  </header>
  <main>
    {% if flash %}<div class="flash {{ 'bad' if flash_bad }}" role="{{ 'alert' if flash_bad else 'status' }}">{{ flash }}</div>{% endif %}
    {% block navrow %}<div class="navrow">{% include "_nav.html" %}</div>{% endblock %}
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
<script>
// Bekräftelser och jobbpolling, utan ramverk.
document.addEventListener('submit', function (e) {
  var msg = (e.submitter && e.submitter.getAttribute('data-confirm-btn')) || e.target.getAttribute('data-confirm');
  if (msg && !confirm(msg)) e.preventDefault();
});
document.querySelectorAll('[data-job]').forEach(function (el) {
  var id = el.getAttribute('data-job'), label = el.querySelector('.p');
  (function poll() {
    fetch('/jobb/' + id, { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
      if (label && j.progress) label.textContent = j.progress;
      if (j.status === 'done' || j.status === 'error') { svReload(); return; }
      setTimeout(poll, 2000);
    }).catch(function () { setTimeout(poll, 5000); });
  })();
});
// Översikten: ladda om när ett jobb blir klart, så att korten visar läget.
if (document.querySelector('[data-refresh]')) setTimeout(svReload, 15000);
</script>
</body>
</html>
